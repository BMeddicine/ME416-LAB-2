; Servo controller firmware for the RASTICrane, ESP32-S3 Super Mini (HW-747 V0.02).
; Open this folder (firmware/) in the PlatformIO extension, then Build / Upload / Monitor.

[env:esp32s3-supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The Super Mini has 4 MB flash (the devkitc-1 profile assumes 8 MB).
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; Serial goes over the native USB port (no USB-UART chip on this board).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
